<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Casa Innov'</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'deep-blue': '#0A2540',
                        'electric-cyan': '#00C4FF',
                        'dark-grey': '#333333'
                    },
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                        'poppins': ['Poppins', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="font-inter bg-gradient-to-br from-gray-50 to-blue-50 min-h-screen flex items-center justify-center p-4">
    <!-- Main Container -->
    <div class="w-full max-w-md">
        <!-- Logo Section -->
        <div class="text-center mb-8">
            <div class="flex items-center justify-center mb-4">
                <div class="w-12 h-12 bg-gradient-to-r from-deep-blue to-electric-cyan rounded-xl flex items-center justify-center">
                    <span class="text-white font-bold text-lg">CI</span>
                </div>
            </div>
            <h1 class="text-2xl font-bold text-deep-blue">Join Casa Innov'</h1>
            <p class="text-gray-600 mt-2">Create your account and start sharing</p>
        </div>

        <!-- Registration Form Card -->
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <!-- Social Registration Options -->
            <div class="space-y-3 mb-6">
                <button class="w-full flex items-center justify-center px-4 py-3 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors group">
                    <svg class="w-5 h-5 mr-3 text-gray-600 group-hover:text-deep-blue" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <span class="text-gray-700 font-medium">Sign up with Google</span>
                </button>
                <button class="w-full flex items-center justify-center px-4 py-3 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors group">
                    <svg class="w-5 h-5 mr-3 text-gray-600 group-hover:text-deep-blue" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                    <span class="text-gray-700 font-medium">Sign up with Facebook</span>
                </button>
            </div>

            <!-- Divider -->
            <div class="relative mb-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-200"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-white text-gray-500">Or create account with email</span>
                </div>
            </div>

            <!-- Registration Form -->
            <form class="space-y-4">
                <div>
                    <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                    <input 
                        type="text" 
                        id="fullName" 
                        name="fullName"
                        required
                        class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-electric-cyan focus:border-transparent transition-colors"
                        placeholder="Enter your full name"
                    >
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                        required
                        class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-electric-cyan focus:border-transparent transition-colors"
                        placeholder="you@company.com"
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            required
                            class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-electric-cyan focus:border-transparent transition-colors pr-10"
                            placeholder="Create a strong password"
                        >
                        <button 
                            type="button" 
                            class="absolute right-3 top-3 text-gray-400 hover:text-gray-600"
                            onclick="togglePassword('password')"
                        >
                            <i data-lucide="eye" class="h-5 w-5" id="passwordIcon"></i>
                        </button>
                    </div>
                    <div class="mt-1 text-xs text-gray-500">
                        Must be at least 8 characters with uppercase, lowercase, and numbers
                    </div>
                </div>

                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword"
                            required
                            class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-electric-cyan focus:border-transparent transition-colors pr-10"
                            placeholder="Confirm your password"
                        >
                        <button 
                            type="button" 
                            class="absolute right-3 top-3 text-gray-400 hover:text-gray-600"
                            onclick="togglePassword('confirmPassword')"
                        >
                            <i data-lucide="eye" class="h-5 w-5" id="confirmPasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="flex items-start">
                        <input type="checkbox" class="h-4 w-4 text-electric-cyan focus:ring-electric-cyan border-gray-200 rounded mt-0.5" required>
                        <span class="ml-2 text-sm text-gray-600">
                            I agree to the 
                            <a href="#" class="text-electric-cyan hover:text-blue-500 transition-colors">Terms of Service</a> 
                            and 
                            <a href="#" class="text-electric-cyan hover:text-blue-500 transition-colors">Privacy Policy</a>
                        </span>
                    </label>
                    
                    <label class="flex items-start">
                        <input type="checkbox" class="h-4 w-4 text-electric-cyan focus:ring-electric-cyan border-gray-200 rounded mt-0.5">
                        <span class="ml-2 text-sm text-gray-600">
                            I would like to receive updates and newsletters about Casa Innov'
                        </span>
                    </label>
                </div>

                <button 
                    type="submit" 
                    class="w-full bg-electric-cyan text-white font-semibold py-3 px-4 rounded-lg hover:bg-blue-500 focus:ring-2 focus:ring-electric-cyan focus:ring-offset-2 transition-all duration-200"
                >
                    Create Account
                </button>
            </form>

            <!-- Sign In Link -->
            <div class="mt-6 text-center">
                <p class="text-gray-600">
                    Already have an account? 
                    <a href="login.html" class="text-electric-cyan font-semibold hover:text-blue-500 transition-colors">
                        Sign in
                    </a>
                </p>
            </div>
        </div>

        <!-- Additional Links -->
        <div class="text-center mt-6">
            <a href="index.html" class="text-sm text-gray-500 hover:text-deep-blue transition-colors inline-flex items-center">
                <i data-lucide="arrow-left" class="h-4 w-4 mr-1"></i>
                Back to home
            </a>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        // Password visibility toggle
        function togglePassword(inputId) {
            const passwordInput = document.getElementById(inputId);
            const passwordIcon = document.getElementById(inputId + 'Icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.innerHTML = '<i data-lucide="eye-off" class="h-5 w-5"></i>';
            } else {
                passwordInput.type = 'password';
                passwordIcon.innerHTML = '<i data-lucide="eye" class="h-5 w-5"></i>';
            }
            lucide.createIcons();
        }
        
        // Password strength validation
        function validatePassword(password) {
            const minLength = password.length >= 8;
            const hasUpper = /[A-Z]/.test(password);
            const hasLower = /[a-z]/.test(password);
            const hasNumber = /\d/.test(password);
            
            return minLength && hasUpper && hasLower && hasNumber;
        }
        
        // Form submission handling
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form data
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Validation
            if (!fullName || !email || !password || !confirmPassword) {
                alert('Please fill in all required fields');
                return;
            }
            
            if (!validatePassword(password)) {
                alert('Password must be at least 8 characters with uppercase, lowercase, and numbers');
                return;
            }
            
            if (password !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }
            
            // Simulate registration process
            const submitButton = this.querySelector('button[type="submit"]');
            const originalText = submitButton.textContent;
            
            submitButton.textContent = 'Creating account...';
            submitButton.disabled = true;
            
            setTimeout(() => {
                // Redirect to confirmation or login
                alert('Account created successfully! Please check your email for verification.');
                window.location.href = 'login.html';
            }, 1500);
        });
        
        // Real-time password validation
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const isValid = validatePassword(password);
            
            if (password.length > 0) {
                this.classList.toggle('border-green-500', isValid);
                this.classList.toggle('border-red-500', !isValid);
            } else {
                this.classList.remove('border-green-500', 'border-red-500');
            }
        });
        
        // Password confirmation validation
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            
            if (confirmPassword.length > 0) {
                this.classList.toggle('border-green-500', password === confirmPassword);
                this.classList.toggle('border-red-500', password !== confirmPassword);
            } else {
                this.classList.remove('border-green-500', 'border-red-500');
            }
        });
    </script>
</body>
</html>
